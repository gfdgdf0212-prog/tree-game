<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a120d">
<title>Древо-Хранитель — AFK Tower Defense</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
--bg:#0a120d; --ink:#e9f2e6; --muted:#8ba793;
--gold:#e8b64c; --gold2:#f6d488; --leaf:#8fd68a; --teal:#6fd3c7;
--ember:#e0704f; --violet:#b07fd8; --danger:#e0564f; --dew:#7cc9e8; --amber:#f0a848;
--line:rgba(150,200,160,.14);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg)}
body{font-family:Manrope,system-ui,sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:manipulation}
#game{position:fixed;inset:0;display:block;z-index:0}
#vignette{position:fixed;inset:0;pointer-events:none;z-index:1;opacity:0;transition:opacity .5s ease-out;
background:radial-gradient(ellipse at center,transparent 45%,rgba(224,86,70,.5) 100%)}
#tutDim{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity .6s;background:rgba(3,8,5,.62)}
#tutDim.on{opacity:1}
#hud-top{position:fixed;top:0;left:0;right:0;z-index:4;display:flex;justify-content:space-between;align-items:flex-start;gap:6px;
padding:calc(8px + env(safe-area-inset-top)) 10px 0;pointer-events:none}
.hud-group{display:flex;gap:6px;align-items:flex-start;flex-wrap:wrap;justify-content:flex-end}
.hud-group.left{justify-content:flex-start}
.pill{pointer-events:auto;display:flex;align-items:center;gap:7px;position:relative;
background:linear-gradient(180deg,rgba(30,45,35,.92),rgba(17,26,20,.94));
border:1px solid var(--line);border-radius:12px;padding:6px 10px;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.pill>svg{width:15px;height:15px;flex:none}
.pill .col{display:flex;flex-direction:column;gap:1px}
.pill .lab{font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:800}
.pill b{font-family:Unbounded;font-weight:700;font-size:13px;line-height:1.1}
#wavePill{flex-direction:column;align-items:stretch;gap:5px}
#wavePill .wp-row{display:flex;align-items:center;gap:7px}
#wavePill .wp-row>svg{width:15px;height:15px;flex:none;color:var(--teal)}
#wavePill b{color:#bfe8d2}
#wavePill.boss-phase .wp-row>svg{color:var(--violet)} #wavePill.boss-phase b{color:#e6d0f7}
#wavePill.boss-phase #wprog i{background:linear-gradient(90deg,var(--violet),#e2b8f2)}
.pass-btn{width:100%;justify-content:center;margin-left:0;border:1px solid rgba(240,168,72,.5);
background:linear-gradient(180deg,rgba(240,168,72,.2),rgba(240,168,72,.05));
color:#ffd9a0;font:800 9px Unbounded;letter-spacing:.05em;padding:5px 9px;border-radius:9px;cursor:pointer;
display:flex;align-items:center;gap:5px;transition:transform .15s,box-shadow .2s}
.pass-btn:hover{transform:translateY(-1px);box-shadow:0 0 10px rgba(240,168,72,.35)}
.pass-btn:active{transform:scale(.92)}
.pass-btn svg{width:11px;height:11px}
.pass-btn .pdot{width:7px;height:7px;border-radius:50%;background:var(--leaf);box-shadow:0 0 7px var(--leaf);display:none}
.pass-btn.has .pdot{display:block}
#seedPill b{color:var(--gold2)}
#seedPill>svg{filter:drop-shadow(0 0 5px rgba(232,182,76,.6));animation:seedPulse 2.4s ease-in-out infinite}
@keyframes seedPulse{50%{transform:scale(1.14)}}
#dewPill b{color:#bfe9f5} #dewPill>svg{filter:drop-shadow(0 0 5px rgba(124,201,232,.6))}
#amberPill b{color:#ffd9a0} #amberPill>svg{filter:drop-shadow(0 0 5px rgba(240,168,72,.6))}
.pill.bump{animation:dewBump .5s ease}
@keyframes dewBump{30%{transform:scale(1.12)}}
#wprog{position:absolute;left:9px;right:9px;bottom:3.5px;height:2.5px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden}
#wprog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),#a5e8c8);transition:width .35s ease}
.ico-btn{pointer-events:auto;width:36px;height:36px;display:grid;place-items:center;padding:0;cursor:pointer;
background:linear-gradient(180deg,rgba(30,45,35,.92),rgba(17,26,20,.94));border:1px solid var(--line);border-radius:11px;
color:var(--muted);box-shadow:0 6px 18px rgba(0,0,0,.35);transition:color .2s,transform .15s,border-color .2s}
.ico-btn:hover{color:var(--ink);transform:translateY(-1px)}
.ico-btn svg{width:16px;height:16px}
#muteBtn .offv{display:none} #muteBtn.off .onv{display:none} #muteBtn.off .offv{display:block}
#waveBanner{position:fixed;left:0;right:0;top:19%;z-index:3;text-align:center;pointer-events:none;opacity:0}
#waveBanner.show{animation:bannerIn 2.6s ease forwards}
@keyframes bannerIn{0%{opacity:0;transform:translateY(16px) scale(.92)}12%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0;transform:translateY(-12px)}}
#waveBanner h2{margin:0;font-family:Unbounded;font-weight:800;font-size:clamp(22px,6vw,44px);letter-spacing:.05em;color:#e2f5e6;
text-shadow:0 0 26px rgba(130,225,170,.5),0 3px 10px rgba(0,0,0,.65)}
#waveBanner p{margin:8px 0 0;font-size:11px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
#waveBanner.boss h2{color:#ecdffb;text-shadow:0 0 30px rgba(176,127,216,.65)}
#waveBanner.boss p{color:#c3a5dd}
#waveBanner.chap h2{color:#ffe2ad;text-shadow:0 0 30px rgba(240,168,72,.7)}
#waveBanner.chap p{color:#e8c79a}
#toast{position:fixed;left:50%;top:calc(68px + env(safe-area-inset-top));transform:translate(-50%,-8px);z-index:6;
background:linear-gradient(180deg,#1d2c23,#131e17);border:1px solid var(--line);border-radius:12px;padding:10px 16px;
font-size:13px;font-weight:600;max-width:86%;text-align:center;box-shadow:0 10px 26px rgba(0,0,0,.45);
opacity:0;pointer-events:none;transition:opacity .4s,transform .4s}
#toast.show{opacity:1;transform:translate(-50%,0)}
#hud-bottom{position:fixed;left:0;right:0;bottom:0;z-index:4;display:flex;justify-content:center;
padding:0 6px calc(7px + env(safe-area-inset-bottom));pointer-events:none;
background:linear-gradient(180deg,#141f18,#0f1812);border-top:1px solid var(--line);box-shadow:0 -10px 30px rgba(0,0,0,.4)}
.tabbar{display:flex;align-items:stretch;gap:5px;width:100%;max-width:820px;pointer-events:auto}
.tabpill{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
padding:7px 2px 6px;border-radius:13px;cursor:pointer;position:relative;
background:linear-gradient(180deg,rgba(30,45,35,.95),rgba(17,26,20,.97));
border:1.5px solid var(--line);color:var(--muted);
box-shadow:0 5px 14px rgba(0,0,0,.4);transition:transform .14s,border-color .2s,color .2s,box-shadow .25s,opacity .3s,filter .3s}
.tabpill:hover{transform:translateY(-2px)}
.tabpill:active{transform:scale(.94)}
.tabpill svg{width:20px;height:20px}
.tabpill .tp-lab{font:800 8px Manrope;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tabpill.t-upg{border-color:rgba(232,182,76,.45);color:var(--gold2)}
.tabpill.t-rou{border-color:rgba(111,211,199,.45);color:var(--teal)}
.tabpill.t-ski{border-color:rgba(143,214,138,.45);color:var(--leaf)}
.tabpill.t-abi{border-color:rgba(176,127,216,.45);color:var(--violet)}
.tabpill.t-que{border-color:rgba(246,212,136,.45);color:var(--gold2)}
.tabpill.t-sho{flex:0 0 56px;border-color:rgba(240,168,72,.4);color:var(--amber)}
.tabpill.locked{opacity:.35;filter:saturate(.25);cursor:default}
.tabpill .tp-badge{position:absolute;top:-5px;right:-3px;min-width:15px;height:15px;padding:0 3px;border-radius:8px;
background:var(--danger);color:#fff;font:800 8.5px Unbounded;display:grid;place-items:center;box-shadow:0 2px 5px rgba(0,0,0,.5)}
.tabpill .tp-dot{position:absolute;top:-3px;right:-1px;width:9px;height:9px;border-radius:50%;background:var(--leaf);box-shadow:0 0 7px var(--leaf)}
.tut-glow{animation:tutGlow 1.1s ease-in-out infinite !important;
box-shadow:0 0 0 2px var(--gold2),0 0 20px rgba(246,212,136,.85) !important;z-index:6 !important;opacity:1 !important;filter:none !important}
@keyframes tutGlow{50%{box-shadow:0 0 0 3px var(--gold2),0 0 30px rgba(246,212,136,1) !important}}
@media(max-width:360px){.tabpill .tp-lab{font-size:7px}.tabpill svg{width:18px;height:18px}.tabpill{padding:6px 1px 5px}}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:3;display:flex;justify-content:center;pointer-events:none;
padding:0 0 calc(56px + env(safe-area-inset-bottom))}
.sheet .panel{pointer-events:auto;width:100%;max-height:50vh;display:flex;flex-direction:column;
background:linear-gradient(180deg,#1c2b22,#141f18);
border:1px solid rgba(150,200,160,.22);border-bottom:none;border-left:none;border-right:none;
border-radius:16px 16px 0 0;box-shadow:0 -14px 44px rgba(0,0,0,.55);
transform:translateY(calc(100% + 80px));transition:transform .32s cubic-bezier(.2,.9,.25,1.05)}
.sheet.open .panel{transform:none}
.panel-grip{flex:none;width:46px;height:5px;border-radius:3px;background:rgba(150,200,160,.3);margin:8px auto 0;cursor:grab;touch-action:none}
.panel-grip:active{cursor:grabbing;background:rgba(150,200,160,.5)}
.panel-head{flex:none;display:flex;align-items:center;gap:10px;padding:8px 14px 8px;border-bottom:1px solid var(--line)}
.panel-head h2{margin:0;font-family:Unbounded;font-size:14px;font-weight:800;flex:1;letter-spacing:.03em}
.panel-close{flex:none;width:28px;height:28px;border-radius:9px;border:1px solid var(--line);
background:rgba(255,255,255,.04);color:var(--muted);font:700 13px Manrope;cursor:pointer;transition:color .2s,transform .15s}
.panel-close:hover{color:var(--ink);transform:scale(1.08)}
.panel-body{flex:1;overflow-y:auto;padding:10px 12px 14px;min-height:0;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.overlay{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:14px;
background:rgba(5,10,7,.72);backdrop-filter:blur(5px);opacity:0;pointer-events:none;transition:opacity .3s}
.overlay.open{opacity:1;pointer-events:auto}
.modal{width:100%;max-width:380px;text-align:center;padding:24px 20px 20px;border-radius:22px;position:relative;
background:linear-gradient(180deg,#1c2b22,#121c15);border:1px solid rgba(150,200,160,.2);
box-shadow:0 30px 80px rgba(0,0,0,.6);max-height:94vh;overflow-y:auto;
transform:translateY(18px) scale(.94);transition:transform .4s cubic-bezier(.2,.9,.25,1.15)}
.overlay.open .modal{transform:none}
.m-ico{width:56px;height:56px;margin:0 auto 12px;border-radius:50%;display:grid;place-items:center}
.m-ico svg{width:25px;height:25px}
.afk .m-ico{background:rgba(111,211,199,.12);border:1px solid rgba(111,211,199,.4);color:#bfe9df;animation:moonFloat 3.5s ease-in-out infinite}
@keyframes moonFloat{50%{transform:translateY(-4px)}}
.over .m-ico{background:rgba(224,86,79,.1);border:1px solid rgba(224,86,79,.4);color:#e8a49b}
.modal h2{margin:0 0 6px;font-family:Unbounded;font-weight:800;font-size:20px}
.afk-sub{margin:0 0 12px;color:var(--muted);font-size:12px;font-weight:600}
.afk-sub b{color:var(--gold2)}
.afk-reward{display:flex;align-items:center;justify-content:center;gap:10px;margin:0 0 10px;padding:12px;border-radius:14px;
background:rgba(232,182,76,.07);border:1px solid rgba(232,182,76,.3)}
.afk-reward.dew-r{background:rgba(124,201,232,.07);border-color:rgba(124,201,232,.3)}
.afk-reward svg{width:24px;height:24px}
.afk-reward b{font-family:Unbounded;font-size:22px;font-weight:800;color:var(--gold2)}
.afk-reward.dew-r b{color:#bfe9f5}
.afk-reward span{color:var(--muted);font-weight:700;font-size:13px}
.stats{display:flex;gap:8px;margin-bottom:18px}
.st{flex:1;background:rgba(255,255,255,.035);border:1px solid rgba(150,200,160,.1);border-radius:12px;padding:10px 6px}
.st b{display:block;font-family:Unbounded;font-size:15px;font-weight:700;margin-bottom:3px}
.st span{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:800}
.btn-primary{display:block;width:100%;border:0;border-radius:14px;padding:13px 20px;cursor:pointer;
font-family:Unbounded;font-weight:700;font-size:12.5px;color:#241a06;
background:linear-gradient(180deg,#f4d083,#dfa93c);box-shadow:0 8px 24px rgba(232,182,76,.3);transition:transform .15s,filter .2s}
.btn-primary:hover{transform:translateY(-2px);filter:brightness(1.06)}
.btn-primary:active{transform:scale(.97)}
.modal.shop.shake-lg,.panel.shake-lg{animation:shakeLg .55s}
@keyframes shakeLg{10%,90%{transform:translate(-2px,1px)}20%,80%{transform:translate(3px,-1px)}30%,70%{transform:translate(-4px,2px)}40%,60%{transform:translate(4px,-2px)}50%{transform:translate(-3px,2px)}}
#mulRow{position:sticky;top:0;z-index:3;margin:-10px -12px 10px;padding:6px 12px;
background:linear-gradient(180deg,#1c2b22,#18251d);border-bottom:1px solid var(--line);display:flex;gap:5px}
.mul-btn{flex:1;border:0;background:transparent;color:var(--muted);font:800 11px Manrope;padding:8px 2px;border-radius:8px;cursor:pointer;transition:color .2s,background .2s}
.mul-btn.on{background:linear-gradient(180deg,#2a3d2f,#1d2b22);color:var(--gold2)}
.upg-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
@media(max-width:380px){.upg-grid{grid-template-columns:1fr}}
.upg{--acc:var(--leaf);--accbg:rgba(143,214,138,.13);position:relative;overflow:hidden;cursor:pointer;
display:flex;flex-direction:column;gap:8px;padding:10px;text-align:left;color:var(--ink);font:inherit;
background:linear-gradient(180deg,#1d2c23,#131e17);border:1px solid var(--line);border-radius:14px;
transition:transform .16s ease,border-color .25s,box-shadow .25s}
.upg-dmg{--acc:var(--ember);--accbg:rgba(224,112,79,.13)}
.upg-spd{--acc:var(--teal);--accbg:rgba(111,211,199,.13)}
.upg-rad{--acc:#c9a06a;--accbg:rgba(201,160,106,.13)}
.upg-cc {--acc:#f6d488;--accbg:rgba(246,212,136,.13)}
.upg-cd {--acc:#e0704f;--accbg:rgba(224,112,79,.13)}
.upg-hp {--acc:var(--leaf);--accbg:rgba(143,214,138,.13)}
.upg:hover:not(:disabled){transform:translateY(-2px);border-color:var(--acc)}
.upg:active:not(:disabled){transform:scale(.97)}
.upg:disabled{opacity:.55;filter:saturate(.35);cursor:default}
.upg-top{display:flex;align-items:center;gap:9px}
.upg-ico{width:34px;height:34px;flex:none;display:grid;place-items:center;border-radius:10px;background:var(--accbg);border:1px solid var(--acc);color:var(--acc)}
.upg-ico svg{width:18px;height:18px}
.upg-mid{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1}
.upg-name{font-weight:800;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.upg-stat{font-size:10px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.upg-bottom{display:flex;align-items:center;justify-content:space-between;gap:6px}
.upg-lvlbig{font:700 10px Unbounded;color:var(--muted)}
.upg-cost{flex:none;display:flex;align-items:center;gap:4px;padding:5px 9px;border-radius:9px;
font-family:Unbounded;font-size:11px;font-weight:700;color:var(--gold2);
background:rgba(232,182,76,.09);border:1px solid rgba(232,182,76,.28);white-space:nowrap}
.upg-cost svg{width:11px;height:11px;flex:none}
.upg.afford .upg-cost{animation:costGlow 1.8s ease-in-out infinite}
@keyframes costGlow{50%{box-shadow:0 0 12px rgba(232,182,76,.4)}}
.upg.bought::after{content:'';position:absolute;inset:0;pointer-events:none;
background:radial-gradient(circle,rgba(255,255,255,.25),transparent 70%);animation:buyFlash .5s ease-out forwards}
@keyframes buyFlash{to{opacity:0}}
.cards-stage{position:relative;height:270px;margin:4px 0 12px;perspective:900px}
.cards-stage.shuffling .rcard{transition:transform .05s cubic-bezier(.4,0,.2,1),opacity .2s,filter .2s}
.rcard{position:absolute;width:70px;height:108px;left:50%;top:50%;cursor:default;
transform-style:preserve-3d;transition:transform .15s cubic-bezier(.34,1.2,.5,1),opacity .25s,filter .2s;will-change:transform}
.rcard .face,.rcard .back{position:absolute;inset:0;border-radius:13px;backface-visibility:hidden;
display:flex;flex-direction:column;align-items:center;padding:8px 6px;
border:2px solid rgba(150,200,160,.42);box-shadow:0 8px 22px rgba(0,0,0,.5)}
.rcard .back{background:radial-gradient(circle at 50% 38%,rgba(150,200,160,.16),transparent 60%),linear-gradient(160deg,#234032,#16241b);transform:rotateY(180deg)}
.rcard .back::before{content:'';position:absolute;inset:8px;border:1px solid rgba(150,200,160,.3);border-radius:9px}
.rcard .back::after{content:'❧';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:26px;color:rgba(150,200,160,.45)}
.rcard .face{background:linear-gradient(170deg,#22352a,#141d16)}
.rcard .nm{font-size:8px;font-weight:800;text-align:center;color:var(--ink);line-height:1.2}
.rcard .plus{margin:auto 0;font-family:Unbounded;font-weight:800;font-size:24px;color:var(--gold2);line-height:1;text-shadow:0 0 14px rgba(246,212,136,.35)}
.rcard .ti{font-size:7px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--tc)}
.rcard.pickable{cursor:pointer}
.rcard.pickable:hover .back{box-shadow:0 0 16px rgba(150,200,160,.6),0 8px 22px rgba(0,0,0,.5)}
.rcard.picked .face{box-shadow:0 0 24px rgba(var(--tg),.55),0 8px 22px rgba(0,0,0,.5);border-color:var(--tc)}
.rcard.dim{opacity:.3;filter:grayscale(.5)}
.rcard.fly-up{animation:flyUp .35s ease-in forwards;pointer-events:none}
.rcard.fly-down{animation:flyDown .4s ease-out forwards;pointer-events:none}
@keyframes flyUp{0%{opacity:1}100%{transform:translate(-50%,-50%) translateY(-380px) scale(.55) rotate(8deg);opacity:0}}
@keyframes flyDown{0%{opacity:1}100%{transform:translate(-50%,-50%) translateY(320px) scale(.65) rotate(-6deg);opacity:0}}
.t-common{--tc:#9db8a4;--tg:157,184,164}
.t-rare{--tc:#5aa9e6;--tg:90,169,230}
.t-epic{--tc:#b07fd8;--tg:176,127,216}
.t-legendary{--tc:#f0a848;--tg:240,168,72}
.t-mythic{--tc:#ff6b8a;--tg:255,107,138}
.btn-spin,.btn-claim{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:14px;
padding:12px;cursor:pointer;font-family:Unbounded;font-weight:700;font-size:13px;transition:transform .15s,filter .2s}
.btn-spin{color:#06232c;background:linear-gradient(180deg,#9fe0d4,#54b8a8);box-shadow:0 8px 22px rgba(111,211,199,.3)}
.btn-claim{color:#241a06;background:linear-gradient(180deg,#f4d083,#dfa93c);box-shadow:0 8px 22px rgba(232,182,76,.3)}
.btn-spin svg,.btn-claim svg{width:15px;height:15px}
.btn-spin:hover:not(:disabled),.btn-claim:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.05)}
.btn-spin:active:not(:disabled),.btn-claim:active:not(:disabled){transform:scale(.97)}
.btn-spin:disabled,.btn-claim:disabled{opacity:.45;cursor:default;box-shadow:none}
.btn-spin.can{animation:spinGlow 1.8s ease-in-out infinite}
@keyframes spinGlow{50%{box-shadow:0 8px 26px rgba(111,211,199,.55)}}
.claim-wrap{position:sticky;top:-10px;z-index:3;margin:-10px -12px 10px;padding:10px 12px 8px;
background:#1c2b22;border-bottom:1px solid var(--line)}
.claim-wrap .btn-claim{margin:0}
.ab-head{display:flex;align-items:baseline;gap:10px;margin:0 2px 10px;flex-wrap:wrap}
.ab-head b{font-family:Unbounded;font-size:14px;color:var(--gold2)}
.abil-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(max-width:420px){.abil-grid{grid-template-columns:1fr}}
.abil{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:13px;cursor:pointer;
background:rgba(255,255,255,.03);border:1px solid rgba(150,200,160,.12);transition:border-color .2s,transform .15s,box-shadow .25s}
.abil:hover{transform:translateY(-1px)}
.abil.locked{opacity:.42;filter:saturate(.25);cursor:default}
.abil.eq{border-color:var(--tc);box-shadow:0 0 0 1px var(--tc),0 0 14px rgba(var(--tg),.22)}
.abil.ex{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 0 14px rgba(232,182,76,.25);cursor:default}
